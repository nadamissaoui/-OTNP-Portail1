name: CI OTNP Portail

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-monitoring:
    name: monitoring-back (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: |
          cd monitoring-back/monitoring-back
          mvn clean compile -DskipTests

  backend-otnp:
    name: OTNP_WS1 (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: |
          cd OTNP_WS1
          mvn clean compile -DskipTests

  frontend:
    name: monitoring-front (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd monitoring-front
          npm ci
      - name: Build
        run: |
          cd monitoring-front
          npm run build

  ai-service:
    name: ai-service (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
      - name: Check syntax
        run: |
          cd ai-service
          python -m py_compile app/main.py
          python -m py_compile app/chat_service.py
