<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#00A0D2"/>
    </marker>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#000064"/>
    </marker>
  </defs>

  <style>
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #222; text-anchor: middle; }
    .sprint-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #000064; text-anchor: middle; }
    .sprint-sub { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #000064; text-anchor: middle; }
    .sprint-note { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #000064; text-anchor: middle; }
    .daily { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #000064; text-anchor: middle; font-weight: bold; }
  </style>

  <!-- Fl�ches planification -->
  <line x1="95" y1="110" x2="175" y2="110" stroke="#00A0D2" stroke-width="8" marker-end="url(#arrowCyan)"/>
  <line x1="295" y1="110" x2="375" y2="110" stroke="#00A0D2" stroke-width="8" marker-end="url(#arrowCyan)"/>
  <path d="M 495 110 C 540 110, 560 75, 610 75" fill="none" stroke="#00A0D2" stroke-width="8" marker-end="url(#arrowCyan)"/>

  <!-- Backlog produit -->
  <circle cx="60" cy="110" r="48" fill="#E6F7FC" stroke="#00A0D2" stroke-width="4"/>
  <rect x="38" y="92" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <rect x="38" y="106" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <rect x="38" y="120" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <text class="label" x="60" y="185">Backlog</text>
  <text class="label" x="60" y="202">produit</text>

  <!-- R�union planification -->
  <circle cx="260" cy="110" r="48" fill="#E6F7FC" stroke="#00A0D2" stroke-width="4"/>
  <rect x="238" y="92" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <rect x="238" y="106" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <rect x="238" y="120" width="44" height="8" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <polyline points="246,110 254,116 272,100" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <text class="label" x="260" y="178">R�union de</text>
  <text class="label" x="260" y="195">planification</text>
  <text class="label" x="260" y="212">du sprint</text>

  <!-- Backlog sprint -->
  <circle cx="460" cy="110" r="48" fill="#E6F7FC" stroke="#00A0D2" stroke-width="4"/>
  <rect x="438" y="88" width="32" height="40" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <rect x="452" y="96" width="32" height="40" rx="2" fill="none" stroke="#00A0D2" stroke-width="2.5"/>
  <text class="label" x="460" y="185">Backlog</text>
  <text class="label" x="460" y="202">du sprint</text>

  <!-- Boucle Sprint principale -->
  <path d="M 820 55 A 95 95 0 1 1 820 165" fill="none" stroke="#000064" stroke-width="14" marker-end="url(#arrowNavy)"/>
  <text class="sprint-title" x="720" y="105">SPRINT</text>
  <text class="sprint-sub" x="720" y="132">6 mois</text>
  <text class="sprint-note" x="720" y="152">(6 sprints)</text>

  <!-- Scrum quotidien -->
  <path d="M 680 45 A 35 35 0 1 1 760 45" fill="none" stroke="#000064" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <text class="daily" x="720" y="28">24H</text>
  <text class="daily" x="720" y="42" font-weight="normal">Scrum quotidien</text>

  <!-- Fl�che vers travail termin� -->
  <line x1="915" y1="110" x2="995" y2="110" stroke="#000064" stroke-width="10" marker-end="url(#arrowNavy)"/>

  <!-- Travail termin� -->
  <circle cx="1060" cy="110" r="48" fill="#000064" stroke="#000064" stroke-width="4"/>
  <rect x="1038" y="88" width="44" height="44" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <polyline points="1048,118 1060,130 1080,100" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text class="label" x="1060" y="185">Travail</text>
  <text class="label" x="1060" y="202">termin�</text>
</svg>
