<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1e40af"/>
    </marker>
    <marker id="arrowReturn" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Fond blanc -->
  <rect width="1200" height="820" fill="#ffffff"/>

  <style>
    .title { font: bold 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    .participant { font: bold 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .participantSub { font: 11px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    .msg { font: 12px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    .msgReturn { font: 12px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    .self { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .altLabel { font: bold 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    .note { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .section { font: bold 12px 'Segoe UI', Arial, sans-serif; fill: #1e40af; }
  </style>

  <!-- Titre -->
  <text x="600" y="38" text-anchor="middle" class="title">Diagramme de sequence  NP_Create</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">Portabilite Entrante | Version fidele au code OTNP | Fond clair</text>

  <!-- Participants -->
  <rect x="50" y="85" width="115" height="52" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="107" y="108" text-anchor="middle" class="participant">jBPM</text>
  <text x="107" y="126" text-anchor="middle" class="participantSub">:8080</text>

  <rect x="310" y="85" width="145" height="52" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="382" y="108" text-anchor="middle" class="participant">C: NPController</text>
  <text x="382" y="126" text-anchor="middle" class="participantSub">Portail :8084</text>

  <rect x="600" y="85" width="145" height="52" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="672" y="108" text-anchor="middle" class="participant">NPServiceClient</text>
  <text x="672" y="126" text-anchor="middle" class="participantSub">(Portail)</text>

  <rect x="890" y="85" width="130" height="52" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="955" y="108" text-anchor="middle" class="participant">NPService</text>
  <text x="955" y="126" text-anchor="middle" class="participantSub">NPCDB :8088</text>

  <!-- Lifelines -->
  <line x1="107" y1="137" x2="107" y2="740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <line x1="382" y1="137" x2="382" y2="740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <line x1="672" y1="137" x2="672" y2="740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <line x1="955" y1="137" x2="955" y2="740" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- Section -->
  <rect x="40" y="155" width="1120" height="26" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
  <text x="55" y="173" class="section">Tache BPMN NP_Create</text>

  <!-- 1. Preparation jBPM -->
  <rect x="92" y="195" width="30" height="480" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="2"/>
  <path d="M107,200 L147,200 L147,225 L107,225" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="157" y="218" class="self">Preparation XML phoneNumber (BPMN ContentData)</text>

  <!-- 2. POST /np/process -->
  <line x1="107" y1="250" x2="382" y2="250" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="245" y="242" text-anchor="middle" class="msg">POST /np/process (application/json)</text>
  <rect x="367" y="255" width="30" height="350" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="2"/>

  <!-- 3. processMessage -->
  <line x1="382" y1="280" x2="672" y2="280" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="527" y="272" text-anchor="middle" class="msg">processMessage(xmlMessage)</text>
  <rect x="657" y="285" width="30" height="270" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="2"/>

  <!-- 4. SOAP build -->
  <path d="M672,310 L712,310 L712,335 L672,335" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="328" class="self">Construction enveloppe SOAP ProcessMessage</text>

  <!-- 5. SOAP call -->
  <line x1="672" y1="360" x2="955" y2="360" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="813" y="352" text-anchor="middle" class="msg">SOAP ProcessMessage</text>
  <rect x="940" y="365" width="30" height="55" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="2"/>
  <path d="M955,385 L995,385 L995,410 L955,410" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1005" y="403" class="self">Traitement NP</text>

  <!-- 6. Return SOAP -->
  <line x1="955" y1="430" x2="672" y2="430" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowReturn)"/>
  <text x="813" y="423" text-anchor="middle" class="msgReturn">StatusCode, StatusMessage</text>

  <!-- 7. NPResponseDto -->
  <path d="M672,450 L712,450 L712,475 L672,475" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="468" class="self">Parsing XML vers NPResponseDto (en memoire)</text>

  <!-- 8. Return to controller -->
  <line x1="672" y1="500" x2="382" y2="500" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowReturn)"/>
  <text x="527" y="493" text-anchor="middle" class="msgReturn">NPResponseDto</text>

  <!-- 9. Return to jBPM -->
  <line x1="382" y1="530" x2="107" y2="530" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowReturn)"/>
  <text x="245" y="523" text-anchor="middle" class="msgReturn">JSON {statusCode, statusMessage}</text>

  <!-- 10. Check 1 -->
  <path d="M107,555 L147,555 L147,580 L107,580" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="157" y="573" class="self">Script Check 1 (0 = succes, -1 = echec)</text>

  <!-- ALT frame -->
  <rect x="180" y="600" width="640" height="100" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <rect x="180" y="600" width="45" height="22" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="188" y="615" class="altLabel">alt</text>
  <text x="235" y="615" class="altLabel">[statusCode == 0] Suite du processus</text>
  <line x1="180" y1="640" x2="820" y2="640" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="235" y="660" class="altLabel">[statusCode == -1] Task Retry ou validation manuelle</text>

  <!-- Note -->
  <rect x="80" y="720" width="1040" height="55" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="6"/>
  <text x="600" y="742" text-anchor="middle" class="note">Pas de BDD Portail | Pas de PortailRequest/PortailResponse | Persistance uniquement cote jBPM</text>
  <text x="600" y="762" text-anchor="middle" class="note">Sources : portabilityin.bpmn, NPController.java, NPServiceClient.java</text>

  <text x="600" y="805" text-anchor="middle" class="subtitle">Projet PFE OTNP  Portabilite entrante simple</text>
</svg>
