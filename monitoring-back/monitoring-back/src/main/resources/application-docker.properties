# Docker profile - remplace les URLs locales par les noms de services Docker

spring.datasource.url=jdbc:mysql://mysql:3306/monitoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Wildfly / jBPM tourne sur la machine hôte (hors Docker)
jbpm.server.url=http://host.docker.internal:8080/kie-server/services/rest/server

# OTNP_WS1 tourne sur Wildfly (hôte)
ws.api.base-url=http://host.docker.internal:8089

# AI service dans Docker via nom de service
ai.python.service-url=http://ai-service:5001

# Simuler les SMS (pas de vrai envoi dans Docker)
sms.simulate=true
